[project]
name = "pipeline_dados_iot"
version = "0.1.0"
description = "Pipeline de dados IoT com Python, Docker e PostgreSQL"
authors = [
    {name = "Lais S Cassiano"}
]
requires-python = ">=3.12,<3.14"
dependencies = [
    "pandas (>=2.2,<3.0)",
    "psycopg2-binary (>=2.9.13,<3.0.0)",
    "sqlalchemy (>=2.1.4,<3.0.0)",
    "streamlit (>=1.65.0,<2.0.0)",
    "plotly (>=7.1.0,<8.0.0)"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
