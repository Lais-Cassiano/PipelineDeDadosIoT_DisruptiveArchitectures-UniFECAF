services:
  postgres:
    image: postgres:16
    container_name: pipeline_dados_iot_postgres
    environment:
      POSTGRES_DB: iot_database
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test_password
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
